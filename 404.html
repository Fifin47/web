<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Stránka nenalezena</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7fb;
      --text: #171923;
      --muted: #667085;
      --card: rgba(255, 255, 255, 0.76);
      --border: rgba(80, 90, 140, 0.16);
      --accent: #5c7cff;
      --accent-2: #2dd4bf;
      --shadow: 0 26px 80px rgba(25, 35, 90, 0.14);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1020;
        --text: #f8fafc;
        --muted: #aab4c7;
        --card: rgba(15, 23, 42, 0.72);
        --border: rgba(148, 163, 184, 0.20);
        --shadow: 0 26px 90px rgba(0, 0, 0, 0.34);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 20%, rgba(92, 124, 255, 0.20), transparent 34%),
        radial-gradient(circle at 82% 18%, rgba(45, 212, 191, 0.15), transparent 30%),
        linear-gradient(145deg, var(--bg), var(--bg));
    }

    main {
      width: min(760px, 100%);
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: clamp(32px, 7vw, 72px);
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      text-align: center;
    }

    main::before {
      content: "404";
      position: absolute;
      inset: auto -22px -46px auto;
      font-size: clamp(7rem, 22vw, 13rem);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.09em;
      color: rgba(92, 124, 255, 0.08);
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.15rem, 8vw, 5rem);
      line-height: 0.94;
      letter-spacing: -0.07em;
    }

    p {
      max-width: 560px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.14rem);
      line-height: 1.72;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 34px;
      position: relative;
      z-index: 1;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      border-radius: 999px;
      padding: 0 18px;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .primary {
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 16px 34px rgba(92, 124, 255, 0.24);
    }

    .secondary {
      color: var(--text);
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.34);
    }

    @media (prefers-color-scheme: dark) {
      .secondary {
        background: rgba(15, 23, 42, 0.34);
      }
    }

    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 38px rgba(20, 30, 90, 0.16);
    }

    .note {
      margin-top: 28px;
      font-size: 0.88rem;
      opacity: 0.72;
    }
  </style>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>
  <main>
    <p class="eyebrow">Stránka nenalezena</p>
    <h1>Tahle cesta nikam nevede.</h1>
    <p>
      Zadaná adresa neexistuje, byla přesunuta, nebo je prostě jen špatně napsaná.
      Doména je aktivní, ale požadovaná stránka tu není.
    </p>

    <div class="actions">
      <a class="primary" href="/">Zpět na hlavní stránku</a>
      <a class="secondary" href="javascript:history.back()">Vrátit se zpět</a>
    </div>

    <p class="note">404 · ondrejfila.cz</p>
  </main>
</body>
</html>
